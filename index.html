<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game">
        <div class="start">
            <div class="main">
                <div>
                    <div class="names">
                        <label for="player1">Player-1</label>
                        <input id="player1" type="text" placeholder="Enter Player 1 name">
                    </div>
                    <div class="names">
                        <label for="player2">Player-2</label>
                        <input id="player2" type="text" placeholder="Enter Player 2 name">
                    </div>
                </div>


                <button id="startbtn">Start</button>
            </div>
        </div>

        <div class="tictactoe">
            <div class="user user1"></div>
            <div class="main">
                <h1>Tic-Tac-Toe</h1>
                <div class="box">
                    <button></button>
                    <button></button>
                    <button></button>
                    <button></button>
                    <button></button>
                    <button></button>
                    <button></button>
                    <button></button>
                    <button></button>
                </div>
                <button id="Replay">
                    <img src="image.png" alt="">
                    <p>Replay</p>
                </button>
            </div>
            <div class="user user2"></div>
        </div>
    </div>



    <script src="script.js"></script>
</body>

</html>
